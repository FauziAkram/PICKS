<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROSH Draft Assistant - STRATZ Clone & Bias Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            stratzBg: '#090c10',
            stratzCard: '#131822',
            stratzSubCard: '#181f2c',
            stratzBorder: '#232c3d',
            radiant: '#00d68f',
            dire: '#ff3d71',
            gold: '#f59e0b'
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbars matching STRATZ */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #090c10; }
    ::-webkit-scrollbar-thumb { background: #232c3d; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #3b475e; }
  </style>
</head>
<body class="bg-stratzBg text-gray-200 min-h-screen flex flex-col font-sans select-none overflow-x-auto">

  <!-- Minimal Utilities Header -->
  <header class="bg-stratzCard/90 border-b border-stratzBorder px-6 py-2.5 flex items-center justify-between text-xs min-w-[1340px]">
    <div class="flex items-center space-x-4">
      <div class="flex items-center space-x-2">
        <span class="text-xl font-black text-gold tracking-wider">ROSH</span>
        <span class="text-[10px] bg-stratzBorder text-gray-300 px-2 py-0.5 rounded font-mono uppercase">Bias Engine</span>
      </div>
      <div class="flex items-center space-x-2">
        <span class="text-gray-400">Rank:</span>
        <select id="rankSelector" class="bg-stratzBg border border-stratzBorder text-gray-200 rounded px-2 py-1 text-xs focus:outline-none">
          <option value="DIVINE_IMMORTAL">Divine & Immortal</option>
          <option value="ANCIENT">Ancient</option>
          <option value="LEGEND" selected>Legend</option>
          <option value="ARCHON">Archon</option>
          <option value="CRUSADER">Crusader</option>
          <option value="GUARDIAN_HERALD">Guardian & Herald</option>
        </select>
      </div>
      <div class="flex items-center space-x-1">
        <input id="matchIdInput" type="text" placeholder="Match ID..." class="bg-stratzBg border border-stratzBorder text-xs text-gray-200 rounded-l px-2.5 py-1 focus:outline-none w-28">
        <button id="btnLoadMatch" class="bg-stratzBorder hover:bg-gray-700 text-xs px-2.5 py-1 rounded-r font-medium text-gray-300">Load</button>
      </div>
    </div>

    <div class="flex items-center space-x-3">
      <button id="btnOpenBiasModal" class="flex items-center space-x-1.5 bg-amber-500/10 border border-amber-500/40 hover:bg-amber-500/20 text-gold px-3 py-1.5 rounded font-semibold transition">
        <span>⚙️ My Hero Biases</span>
      </button>
      <button id="btnResetDraft" class="bg-stratzBorder hover:bg-red-500/20 border border-transparent text-gray-300 hover:text-red-400 px-3 py-1.5 rounded transition font-medium">
        Reset
      </button>
    </div>
  </header>

  <!-- Faction Headers (Exact STRATZ layout) -->
  <div class="px-6 py-3 border-b border-stratzBorder bg-stratzCard/40 min-w-[1340px]">
    <div class="grid grid-cols-2 gap-8 max-w-[1600px] mx-auto">
      
      <!-- Radiant Header -->
      <div class="flex items-center justify-between bg-stratzCard/80 border border-stratzBorder/80 px-4 py-2.5 rounded-lg">
        <div class="flex items-center space-x-3">
          <div class="w-8 h-8 rounded bg-radiant/20 border border-radiant/40 flex items-center justify-center text-radiant font-black text-sm">🌳</div>
          <span class="text-base font-bold text-white">Radiant</span>
          <button id="btnRadiantBans" class="text-xs bg-stratzBorder hover:bg-gray-700 text-gray-300 px-2.5 py-1 rounded font-medium transition">Select Bans</button>
        </div>
        <div class="flex items-center space-x-4">
          <div class="text-right">
            <div class="text-[11px] text-gray-400 font-mono flex items-center justify-end space-x-1">
              <span id="radiantOriginalTS">0.0</span>
              <span>🔒</span>
            </div>
            <div id="radiantCurrentTS" class="text-lg font-black text-white leading-tight">0.0</div>
          </div>
          <div class="text-right border-l border-stratzBorder pl-4">
            <span class="text-[10px] text-gray-400 block uppercase font-bold">Diff</span>
            <span id="tsDifferential" class="text-lg font-black text-gold">+0.0</span>
          </div>
        </div>
      </div>

      <!-- Dire Header -->
      <div class="flex items-center justify-between bg-stratzCard/80 border border-stratzBorder/80 px-4 py-2.5 rounded-lg">
        <div class="flex items-center space-x-4">
          <div class="text-left">
            <div class="text-[11px] text-gray-400 font-mono flex items-center space-x-1">
              <span>🔒</span>
              <span id="direOriginalTS">0.0</span>
            </div>
            <div id="direCurrentTS" class="text-lg font-black text-white leading-tight">0.0</div>
          </div>
        </div>
        <div class="flex items-center space-x-3">
          <button id="btnDireBans" class="text-xs bg-stratzBorder hover:bg-gray-700 text-gray-300 px-2.5 py-1 rounded font-medium transition">Select Bans</button>
          <span class="text-base font-bold text-white">Dire</span>
          <div class="w-8 h-8 rounded bg-dire/20 border border-dire/40 flex items-center justify-center text-dire font-black text-sm">🌋</div>
        </div>
      </div>

    </div>
  </div>

  <!-- 10-Column ROSH Grid Container -->
  <main class="flex-1 px-6 py-4 min-w-[1340px]">
    <div class="grid grid-cols-2 gap-8 max-w-[1600px] mx-auto">
      
      <!-- Radiant 5 Columns -->
      <div id="radiantColumns" class="grid grid-cols-5 gap-2.5">
        <!-- Rendered via JS: Radiant Pos 1, 2, 3, 4, 5 -->
      </div>

      <!-- Dire 5 Columns -->
      <div id="direColumns" class="grid grid-cols-5 gap-2.5">
        <!-- Rendered via JS: Dire Pos 1, 2, 3, 4, 5 -->
      </div>

    </div>
  </main>

  <!-- Personal Bias Modal Placeholder -->
  <div id="biasModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-stratzCard border border-stratzBorder rounded-xl max-w-2xl w-full p-6 shadow-2xl">
      <div class="flex items-center justify-between border-b border-stratzBorder pb-3 mb-4">
        <h3 class="text-base font-bold text-white flex items-center space-x-2">
          <span>⚙️ Custom Hero Biases</span>
          <span class="text-xs text-gold font-normal">(Personalize recommendations)</span>
        </h3>
        <button id="btnCloseBiasModal" class="text-gray-400 hover:text-white text-lg font-bold">✕</button>
      </div>
      <p class="text-xs text-gray-400 mb-4">
        Give positive points to heroes you master, and heavy negative points to heroes you never play. The ROSH engine will adapt all 10 recommendation columns accordingly.
      </p>
      <div id="biasHeroList" class="max-h-96 overflow-y-auto space-y-2 pr-2 text-xs">
        <!-- Populated via JS -->
      </div>
    </div>
  </div>

<script type="module" src="app.js"></script>
</body>
</html>
